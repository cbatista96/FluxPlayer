name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      DOTNET_CLI_UI_LANGUAGE: en
    steps:
      - uses: actions/checkout@v5
      - name: Set up .NET SDKs and runtime
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.402
      - name: Restore
        run: dotnet restore FluxPlayer.sln -p:Platform=x64
      - name: Verify feature checklist
        run: pwsh -NoProfile -File tools/Sync-PublicFeatures.ps1 -Verify
      - name: Build
        run: dotnet build FluxPlayer.sln -c Release -p:Platform=x64 --no-restore -warnaserror
      - name: Test managed services
        run: dotnet run --project FluxPlayer.Tests/FluxPlayer.Tests.csproj -c Release --no-build -- --managed-only
